name: Windows package verification

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify-windows-package:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js for build only
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify Windows batch files are ASCII
        shell: pwsh
        run: |
          $files = @(
            "install-and-start.bat",
            "scripts/run_windows.bat",
            "scripts/start_backend.bat",
            "scripts/start_frontend.bat"
          )
          foreach ($file in $files) {
            if (!(Test-Path $file)) {
              throw "Missing batch file: $file"
            }
            $bytes = [System.IO.File]::ReadAllBytes($file)
            $nonAscii = $bytes | Where-Object { $_ -gt 127 }
            if ($nonAscii.Count -gt 0) {
              throw "$file contains non-ASCII bytes. Keep customer-facing batch files ASCII for cmd.exe compatibility."
            }
          }

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: frontend
        run: npm install

      - name: Build frontend
        shell: pwsh
        working-directory: frontend
        run: npm run build

      - name: Validate backend syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem backend/app, backend/app/services -Filter *.py | ForEach-Object { $_.FullName }
          python -m py_compile @files

      - name: Verify customer package does not require Node at runtime
        shell: pwsh
        run: |
          if (!(Test-Path "frontend/dist/index.html")) {
            throw "frontend/dist/index.html is missing. Customer package would require Node.js."
          }
          $script = Get-Content "scripts/run_windows.bat" -Raw
          if ($script -notmatch 'FRONTEND_BUILT') {
            throw "scripts/run_windows.bat does not detect built frontend files."
          }
          if ($script -notmatch 'Node.js/npm was not found') {
            throw "scripts/run_windows.bat no longer has a clear Node.js error for source-mode packages."
          }
          if ($script -notmatch 'LocalReportReader.exe') {
            throw "scripts/run_windows.bat does not prefer the bundled executable."
          }

      - name: Create CI env file
        shell: pwsh
        run: |
          @"
          OPENAI_API_KEY=test-key-for-ci
          OPENAI_BASE_URL=https://api.siliconflow.cn/v1
          OPENAI_MODEL=deepseek-ai/DeepSeek-V3
          ECONOMIC_AUDIT_MODEL=deepseek-ai/DeepSeek-R1
          OPENAI_API_STYLE=chat_completions
          MAX_AI_CHARS=32000
          AI_TIMEOUT_SECONDS=240
          "@ | Set-Content -Encoding ascii .env

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --name LocalReportReader `
            --onefile `
            --paths backend `
            --add-data "frontend/dist;frontend/dist" `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            desktop_app.py
          if (!(Test-Path "dist\LocalReportReader.exe")) {
            throw "PyInstaller did not create dist\LocalReportReader.exe."
          }

      - name: Stage no-runtime customer package shape
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "local-report-reader-package"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage\scripts" | Out-Null
          Copy-Item "dist\LocalReportReader.exe" "$stage\LocalReportReader.exe"
          Copy-Item ".env" "$stage\.env"
          Copy-Item ".env.example" "$stage\.env.example"
          Copy-Item "README.md" "$stage\README.md"
          Copy-Item "install-and-start.bat" "$stage\install-and-start.bat"
          Copy-Item "scripts\run_windows.bat" "$stage\scripts\run_windows.bat"
          if (!(Test-Path "$stage\LocalReportReader.exe")) {
            throw "Staged customer package is missing LocalReportReader.exe."
          }
          if (Test-Path "$stage\.git") {
            throw "Staged customer package unexpectedly contains .git."
          }
          if (Test-Path "$stage\.jj") {
            throw "Staged customer package unexpectedly contains .jj."
          }
          if (Test-Path "$stage\data") {
            throw "Staged customer package unexpectedly contains data."
          }
          if (Test-Path "$stage\.venv") {
            throw "Staged customer package unexpectedly contains .venv."
          }
          if (Test-Path "$stage\frontend\node_modules") {
            throw "Staged customer package unexpectedly contains frontend\node_modules."
          }

      - name: Start staged executable and verify health
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "local-report-reader-package"
          $process = Start-Process `
            -FilePath "$stage\LocalReportReader.exe" `
            -PassThru `
            -WindowStyle Hidden `
            -WorkingDirectory $stage
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/api/health" -TimeoutSec 2
                if ($health.ok -eq $true) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Backend did not become healthy on port 8787."
            }

            $page = Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -TimeoutSec 5
            if ($page.StatusCode -ne 200) {
              throw "Frontend page did not return HTTP 200 from bundled executable."
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Upload verified Windows package artifact
        uses: actions/upload-artifact@v4
        with:
          name: local-report-reader-windows-no-runtime
          path: ${{ runner.temp }}\local-report-reader-package
